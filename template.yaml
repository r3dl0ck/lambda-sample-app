# Szablon aplikacji wdrazanej przez pipeline (etap Deploy).
# `aws cloudformation package` (buildspec.yml) zamienia lokalne Code: src/
# na obiekt S3 i zapisuje wynik jako packaged-template.yaml.
AWSTemplateFormatVersion: "2010-09-09"
Description: Przykladowa aplikacja Lambda wdrazana przez CodePipeline

Parameters:
  AppVersion:
    Type: String
    Default: "1.0.0"

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-app-function
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt FunctionRole.Arn
      Code: src/
      Environment:
        Variables:
          APP_VERSION: !Ref AppVersion

  # HTTP API (API Gateway v2) z integracja proxy do Lambdy (payload format 2.0,
  # zgodny z event["rawPath"] uzywanym w src/app.py).
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: workshop-app-api
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AppFunction.Arn
      PayloadFormatVersion: "2.0"

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  # Zezwolenie dla API Gateway na wywolywanie funkcji
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AppFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
